<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circulação sanguínea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#ffffff; --slide:#ffffff; --ink:#16213a; --muted:#56627a;
  --vein:#2f6fb0; --artery:#c8324b; --deep:#7a1830; --line:#d5dbe6;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);display:grid;place-items:center;overflow:hidden;
  font-family:"Atkinson Hyperlegible",system-ui,sans-serif;color:var(--ink)}
#fit{position:fixed;inset:0;overflow:hidden}
.slide{position:absolute;inset:0;background:var(--slide)}
.left{--z:1;order:2;padding:56px 96px 48px 56px;display:flex;flex-direction:column;overflow-y:auto}
h1{font-family:"Bricolage Grotesque",Georgia,serif;font-weight:700;font-size:78px;
  line-height:1;letter-spacing:-.035em;margin:0 0 26px;white-space:nowrap}
.where{margin:44px 0 auto;max-width:none}
.where h2{font-family:"Bricolage Grotesque",Georgia,serif;font-weight:700;font-size:calc(58px*var(--z));
  letter-spacing:-.02em;line-height:1.05;margin:0 0 20px}
.where p{font-size:calc(28px*var(--z));line-height:1.5;color:var(--muted);margin:0;min-height:3em}
.circ{display:flex;gap:4px;margin:0 0 14px}
.circ div{flex:1;position:relative;text-align:center;padding-bottom:8px;border-bottom:2px solid #c3cbd8;
  font-size:calc(17px*min(var(--z),1.3));font-weight:700;color:var(--muted);transition:color .3s,border-color .3s}
.circ div::before,.circ div::after{content:"";position:absolute;bottom:-9px;width:2px;height:9px;background:inherit;
  background-color:#c3cbd8;transition:background-color .3s}
.circ div::before{left:0}.circ div::after{right:0}
.circ small{font-size:calc(15px*min(var(--z),1.3));font-weight:400}
.circ div.on{color:var(--ink);border-color:var(--ink)}
.circ div.on::before,.circ div.on::after{background-color:var(--ink)}
.track{display:flex;gap:4px;margin:0}
.track .seg{flex:1;display:flex;flex-direction:column;gap:7px;background:none;border:0;
  padding:0;margin:0;font:inherit;cursor:pointer;text-align:center}
.track .seg:hover i{box-shadow:0 0 0 2px var(--line)}
.track .seg:hover span{color:var(--ink)}
.track .seg:focus-visible{outline:3px solid var(--vein);outline-offset:4px}
.track .seg i{height:18px;border-radius:5px;position:relative;overflow:hidden;background:#e9edf3}
/* o pedaço colorido cresce da esquerda conforme as hemácias avançam */
.track .seg i b{position:absolute;top:0;left:0;bottom:0;width:0;border-radius:5px}
.track .seg span{font-size:calc(17px*min(var(--z),1.15));line-height:1.25;text-align:center;color:var(--muted);transition:color .3s}
.track .seg.on span{color:var(--ink);font-weight:700}
.track .seg.v i b{background:var(--vein)}
.track .seg.a i b{background:var(--artery)}
.track .seg.vp i b{background:linear-gradient(90deg,var(--vein),var(--artery))}
.track .seg.av i b{background:linear-gradient(90deg,var(--artery),var(--vein))}
.gauge{display:flex;align-items:center;gap:22px;margin-top:14px}
.gauge small{font-size:calc(21px*var(--z));color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:6px 28px;margin-top:16px;font-size:calc(19px*var(--z));color:var(--muted)}
.stats b{font-family:"Bricolage Grotesque",sans-serif;font-size:calc(32px*var(--z));color:var(--ink);margin-right:8px}
button{font:inherit;font-size:20px;padding:10px 20px;border-radius:999px;border:2px solid var(--ink);
  background:transparent;color:var(--ink);cursor:pointer;margin-left:auto}
button:hover{background:var(--ink);color:#fff}
button:focus-visible,.heart:focus-visible{outline:3px solid var(--vein);outline-offset:4px}
/* zoom do texto da esquerda */
.zoom{position:absolute;top:24px;right:96px;display:flex;align-items:center;gap:6px;z-index:2}
.zoom button{margin:0;padding:0;width:40px;height:40px;font-size:17px;font-weight:700;border-width:2px}
.zoom output{min-width:52px;text-align:center;font-size:16px;color:var(--muted);cursor:pointer}
.right{position:absolute;inset:0;background:#fff}
.done{display:none}
#ring{display:none}
svg{display:block;width:100%;height:100%}
.heart{cursor:pointer;outline:none}
.done{position:absolute;left:50%;top:22px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:999px;font-size:19px;white-space:nowrap;opacity:0;transition:opacity .5s}
.done.show{opacity:1}
.ring{animation:ring 1.6s ease-out infinite;transform-origin:595px 885px;transform-box:view-box}
@keyframes ring{from{transform:scale(.8);opacity:.7}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.ring{animation:none;opacity:.4}}
</style>
</head>

  const bodySpots=[[400,1335],[378,1350],[405,1365],[356,1330],[385,1370],[340,1345]];
  const CAVA=[[320,1325],[282,1290],[260,1240],[256,1180]];
  const SUP=[[228,1100],[220,1000],[223,930],[236,850],[270,775],[320,732],[380,712],[432,722],[462,737],[470,752]]; // para no limite da veia cava superior
  const INF=[[292,1148],[340,1085],[390,1040],[425,1012],[450,992],[462,980]]; // para no limite da veia cava inferior
  const cavaRoutes=bodySpots.map((s,i)=>mkRoute([s,...CAVA,...(i%2?INF:SUP)]));

  // dentro do coração a hemácia acompanha o pulso (escala em torno de 595,885) e fica um pouco menor
  const HEART=[[440,745],[480,715],[560,705],[640,712],[690,730],[730,785],[760,850],[762,1045],[650,1062],[540,1042],[470,1002],[428,900],[425,800]];
  function inPoly(x,y){let r=false;for(let i=0,j=HEART.length-1;i<HEART.length;j=i++){const a=HEART[i],b=HEART[j];
    if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])r=!r;}return r;}
  let sc=1;
  function place(c,x,y,rot,dt,scale){
    c.h+=((inPoly(x,y)?1:0)-c.h)*Math.min(1,dt*8);
    const k=1+(sc-1)*c.h;
    c.g.setAttribute('transform','translate('+(595+(x-595)*k).toFixed(1)+' '+(885+(y-885)*k).toFixed(1)+') rotate('+rot.toFixed(1)+') scale('+((1-0.25*c.h)*k*(scale||1)).toFixed(3)+')');
  }
  function pose(R,s,side){
    const p=R.p.getPointAtLength(s), q=R.p.getPointAtLength(Math.min(R.L,s+2));
    const a=Math.atan2(q.y-p.y,q.x-p.x), off=side*Math.min(1,s/80)*Math.max(0,1-s/R.L*1.15);
    return {x:p.x-Math.sin(a)*off, y:p.y+Math.cos(a)*off, rot:a*57.3+90};
  }
  // curva quadrática para os ramos dos capilares
  function qpose(p0,c,p1,t){const u=1-t;
    return {x:u*u*p0[0]+2*u*t*c[0]+t*t*p1[0], y:u*u*p0[1]+2*u*t*c[1]+t*t*p1[1],
      rot:Math.atan2(u*(c[1]-p0[1])+t*(p1[1]-c[1]),u*(c[0]-p0[0])+t*(p1[0]-c[0]))*57.3+90};}
  function paint(el,bright){el.setAttribute('fill',bright?'url(#rbcBright)':'url(#rbcDark)');el.setAttribute('stroke',bright?'#7a0f1c':'#3c0814');}
  function mkMini(bright){const e=document.createElementNS(NS,'ellipse');e.setAttribute('rx',9);e.setAttribute('ry',6);e.setAttribute('stroke-width','0.8');paint(e,bright);outside.appendChild(e);return e;}
  function showDone(n){const d=document.getElementById('done');d.textContent=['','Chegou aos pulmões','Voltou ao coração','Circuito completo'][n];d.classList.add('show');}

  function makeCell(){
    const g=document.createElementNS(NS,'g');
    const e=document.createElementNS(NS,'ellipse');
    e.setAttribute('rx',20);e.setAttribute('ry',13);e.setAttribute('fill','url(#rbcDark)');
    e.setAttribute('stroke','#3c0814');e.setAttribute('stroke-width','1.2');
    g.appendChild(e);g.cell=e;return g;
  }

  const ROUTE={vein:'r2',aorta:'ra',cava:'rc'};   // etapas movidas pelos batimentos
  const NEXT={rest:'vein',vent:'aorta',body:'cava'}; // paradas que seguem ao apertar
  let cells=[], beats=0, fill=1, pressed=false, started=false, arrived=0, atrium=0, atrL=0;
  const V0=(L/4.3)*3.2, DRAG=3.2;

  function reset(){
    inHeart.innerHTML='';behind.innerHTML='';mid.innerHTML='';outside.innerHTML='';cells=[];beats=0;fill=1;arrived=0;atrium=0;atrL=0;
    for(let i=0;i<6;i++){
      const g=makeCell();inHeart.appendChild(g);
      cells.push({g,s:i*24,v:0,side:(i%2?1:-1)*(4+i%3*3),state:'path',t:0,k:0.92+Math.random()*0.16,ph:Math.random()*6,
        spot:lungSpots[i],atrR:atriumSpots[i],vent:ventSpots[i],body:bodySpots[i],
        r2:routes2[i],ra:aortaRoutes[i],rc:cavaRoutes[i],rot:0,h:0,minis:[],jr:[0,1,2].map(()=>(Math.random()-0.5)*30)});
    }
    document.getElementById('done').classList.remove('show');
    ui();
  }

  // clique numa divisória: as hemácias vão direto para aquela região
  function teleport(k){
    document.getElementById('done').classList.remove('show');
    if(!started){started=true;document.getElementById('ring').style.display='none';}
    arrived=k>=2?6:0; atrium=k>=4?6:0; atrL=0;
    cells.forEach((c,i)=>{
      c.minis.forEach(m=>m.remove());c.minis=[];
      c.v=0;c.t=0;c.h=0;c.g.style.opacity=1;
      paint(c.g.cell,k>=2&&k<=7); // vermelho vivo dos pulmões até a aorta
      (k===0?inHeart:k===1?behind:k===6?mid:outside).appendChild(c.g);
      if(k<=1){c.state='path';c.s=(k?HEART_EXIT+20:0)+i*24;}
      else if(k===2)c.state='rest';
      else if(k===3){c.state='vein';c.s=c.r2.L*0.1+i*26;}
      else if(k===4)c.state='atrium';
      else if(k===5)c.state='vent';
      else if(k===6){c.state='aorta';c.s=c.ra.L*0.08+i*26;}
      else if(k===7){c.state='aorta';c.s=c.ra.L;}   // chega nos capilares e se ramifica
      else if(k===8){c.state='cava';c.s=c.rc.L*0.1+i*26;}
      else {c.state='cava';c.s=c.rc.L;}             // chega ao limite da veia cava
    });
    ui();
  }

  function press(){
    if(pressed)return;pressed=true;
    if(!started){started=true;document.getElementById('ring').style.display='none';}
    if(fill>0.05){
      const imp=V0*fill;
      cells.forEach(c=>{
        if(NEXT[c.state]){c.state=NEXT[c.state];c.s=0;c.v=0;(c.state==='aorta'?mid:outside).appendChild(c.g);document.getElementById('done').classList.remove('show');}
        if(c.state==='path')c.v+=imp*c.k;
        else if(ROUTE[c.state])c.v+=(c[ROUTE[c.state]].L/4.3)*3.2*fill*c.k;
      });
      beats++;
    }
  }
  function release(){pressed=false;}

  // sem clique no coração: nesta versão quem conduz é a prova

  // divisórias do trajeto: nome da região e o que acontece nela
  const STAGES=[
    {n:'Ventrículo direito',c:'v',t:'A contração aperta o sangue venoso (pobre em oxigênio e rico em gás carbônico) e o empurra para fora do coração.'},
    {n:'Artéria pulmonar',c:'v',t:'A única artéria que leva sangue venoso. O destino são os pulmões.'},
    {n:'Pulmões',c:'vp',t:'É onde ocorre a troca gasosa: sai o gás carbônico do sangue e entra gás oxigênio. Essa troca é chamada de hematose. A hematose é a oxigenação do sangue. O sangue abastecido de oxigênio é chamado de sangue arterial.'},
    {n:'Veia pulmonar',c:'a',t:'É a veia que leva o sangue (agora arterial) de volta para o coração.'},
    {n:'Átrio esquerdo',c:'a',t:'Recebe o sangue que volta dos pulmões e o passa ao ventrículo esquerdo quando o coração relaxa.'},
    {n:'Ventrículo esquerdo',c:'a',t:'A câmara de parede mais grossa: a contração dela manda o sangue para o corpo inteiro, saindo pela artéria aorta.'},
    {n:'Artéria aorta',c:'a',t:'A maior artéria do corpo. Sai do ventrículo esquerdo por trás da artéria pulmonar.'},
    {n:'Células',c:'av',t:'Aqui o sangue entrega oxigênio às células, que fazem a combustão celular e liberam gás carbônico. Agora o sangue volta a ser venoso.'},
    {n:'Veias cavas',c:'v',t:'A cava superior traz o sangue da parte de cima do corpo; a inferior, o da parte de baixo.'},
    {n:'Átrio direito',c:'v',t:'O sangue pobre em oxigênio chega ao coração e o trajeto recomeça no ventrículo direito.'}
  ];

  const STAGE_OF={capP:2,appear:2,rest:2,vein:3,atrium:4,fillV:5,vent:5,aorta:6,capR:7,capL:7,body:7,cava:8,atrL:9};
  const stageOf=c=>c.state==='path'?(c.s>HEART_EXIT?1:0):STAGE_OF[c.state];
  const FRAC={capP:c=>0.35*Math.min(1,c.t/1.5), appear:c=>0.35+0.25*Math.min(1,c.t/0.45), rest:()=>0.75,
    atrium:()=>0.5, fillV:c=>0.5*Math.min(1,c.t/0.7), vent:()=>0.5,
    capR:c=>0.35*Math.min(1,c.t/1.8), capL:c=>0.35+0.4*Math.min(1,c.t/1.3), body:()=>0.8, atrL:()=>1};
  function progress(c){
    if(c.state==='path')return c.s<HEART_EXIT?c.s/HEART_EXIT:1+(c.s-HEART_EXIT)/(L-HEART_EXIT);
    const R=ROUTE[c.state]&&c[ROUTE[c.state]];
    return stageOf(c)+Math.min(1,R?c.s/R.L:FRAC[c.state](c));
  }
  const count=st=>cells.filter(c=>c.state===st).length+'/6';
  function ui(){}   // o painel de texto agora fica na prova, fora deste quadro

  let last=performance.now();
  function tick(now){
    const rdt=Math.min(0.05,(now-last)/1000);last=now;
    // bomba: esvazia rápido ao apertar, enche devagar ao soltar
    fill=pressed?Math.max(0,fill-rdt/0.18):Math.min(1,fill+rdt/0.9);
    const dt=rdt*SPEED; // as hemácias andam em câmera lenta; a bomba não
    sc=pressed?0.94+0.06*fill:1+0.045*fill;
    const T='translate(595 885) scale('+sc.toFixed(4)+') translate(-595 -885)';
    ['heartScale','trunkFront','heartTop'].forEach(id=>document.getElementById(id).setAttribute('transform',T));
    const w=reduce?0:1;
    conduzir(now);

    for(const c of cells){
      if(c.state==='path'){
        c.s+=c.v*dt; c.v*=Math.exp(-DRAG*dt); if(c.v<2)c.v=0;
        if(c.s>HEART_EXIT && c.g.parentNode===inHeart) behind.appendChild(c.g);
        if(c.s>=L){c.s=L;c.state='capP';c.t=0;c.g.style.opacity=0;c.minis=[0,1,2].map(()=>mkMini(false));}
        const p=path.getPointAtLength(c.s), q=path.getPointAtLength(Math.min(L,c.s+2));
        const a=Math.atan2(q.y-p.y,q.x-p.x); const off=c.side*Math.max(0,1-c.s/L*1.2);
        const x=p.x-Math.sin(a)*off, y=p.y+Math.cos(a)*off;
        c.g.setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+(a*57.3+90).toFixed(1)+')');
        c.x=x;c.y=y;
      } else if(c.state==='capP'){
        // no fim da artéria pulmonar a hemácia se separa pelos capilares e entra no pulmão
        c.t+=dt; const k=Math.min(1,c.t/1.3), e=1-(1-k)*(1-k);
        c.minis.forEach((m,j)=>{const b=capLung[j], p=qpose(P[P.length-1],b[0],[b[1][0],b[1][1]+c.jr[j]*0.4],e);
          m.setAttribute('transform','translate('+p.x.toFixed(1)+' '+p.y.toFixed(1)+') rotate('+p.rot.toFixed(1)+')');
          m.style.opacity=Math.min(1,(1-k)/0.4);});
        if(c.t>1.5){c.minis.forEach(m=>m.remove());c.minis=[];c.state='appear';c.t=0;paint(c.g.cell,true);}
      } else if(c.state==='appear'){
        c.t+=dt; const k=Math.min(1,c.t/0.45); const e=1-Math.pow(1-k,3);
        c.g.style.opacity=k;
        c.g.setAttribute('transform','translate('+c.spot[0]+' '+c.spot[1]+') scale('+(0.2+0.8*e).toFixed(3)+')');
        if(k>=1){c.state='rest';c.t=0;arrived++;if(arrived===6)showDone(1);}
      } else if(c.state==='rest'){
        c.t+=dt;
        const x=c.spot[0]+Math.sin(c.t*1.3+c.ph)*4*w, y=c.spot[1]+Math.cos(c.t*1.1+c.ph)*3*w;
        c.g.setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+(Math.sin(c.t+c.ph)*20*w).toFixed(1)+')');
      } else if(ROUTE[c.state]){
        // veia pulmonar, aorta ou veias cavas: cada batimento dá um empurrão
        const R=c[ROUTE[c.state]];
        c.s+=c.v*dt; c.v*=Math.exp(-DRAG*dt); if(c.v<2)c.v=0;
        const end=c.s>=R.L; if(end)c.s=R.L;
        const p=pose(R,c.s,c.side); c.rot=p.rot;
        place(c,p.x,p.y,p.rot,dt);
        if(end){
          c.t=0;
          if(c.state==='vein'){c.state='atrium';atrium++;if(atrium===6)showDone(2);}
          else if(c.state==='aorta'){c.state='capR';c.g.style.opacity=0;c.minis=[0,1,2].map(()=>mkMini(true));}
          else {c.state='atrL';atrL++;if(atrL===6)showDone(3);}
        }
      } else if(c.state==='atrL'){
        // entra no átrio: some bem no limite da veia cava, sem passar por cima do coração
        c.t+=dt; c.g.style.opacity=Math.max(0,1-Math.max(0,c.t-1.6)/0.35); // espera no átrio direito e some
      } else if(c.state==='atrium'||c.state==='vent'){
        c.t+=dt;
        const sp=c.state==='atrium'?c.atrR:c.vent;
        place(c,sp[0]+Math.sin(c.t*1.3+c.ph)*2*w,sp[1]+Math.cos(c.t*1.1+c.ph)*2*w,c.rot+Math.sin(c.t+c.ph)*15*w,dt);
        // ao soltar (coração relaxando) o átrio passa as hemácias para o ventrículo
        if(c.state==='atrium'&&!pressed&&alvo!==null&&c.t>1.8){c.state='fillV';c.t=0;} // espera no átrio esquerdo
      } else if(c.state==='fillV'){
        c.t+=dt; const k=Math.min(1,c.t/0.7), e=k*k*(3-2*k);
        c.rot+=(Math.atan2(c.vent[1]-c.atrR[1],c.vent[0]-c.atrR[0])*57.3+90-c.rot)*Math.min(1,dt*8);
        place(c,c.atrR[0]+(c.vent[0]-c.atrR[0])*e,c.atrR[1]+(c.vent[1]-c.atrR[1])*e,c.rot,dt);
        if(k>=1){c.state='vent';c.t=0;}
      } else if(c.state==='capR'){
        // a hemácia se ramifica pelos capilares do lado direito do corpo e some
        c.t+=dt; const k=Math.min(1,c.t/1.3), e=1-(1-k)*(1-k);
        c.minis.forEach((m,j)=>{const b=capRight[j], p=qpose(CAP_IN,b[0],[b[1][0],b[1][1]+c.jr[j]],e);
          m.setAttribute('transform','translate('+p.x.toFixed(1)+' '+p.y.toFixed(1)+') rotate('+p.rot.toFixed(1)+')');
          m.style.opacity=Math.min(1,(1-k)/0.4);});
        if(c.t>1.8){c.minis.forEach(m=>m.remove());c.minis=[0,1,2].map(()=>mkMini(false));paint(c.g.cell,false);c.state='capL';c.t=0;}
      } else if(c.state==='capL'){
        // reaparece do lado esquerdo, sem oxigênio, e os ramos se juntam na saída
        c.t+=dt; const k=Math.min(1,c.t/1.3), e=k*k*(3-2*k);
        c.minis.forEach((m,j)=>{const b=capLeft[j], p=qpose([b[1][0],b[1][1]+c.jr[j]],b[0],c.body,e);
          m.setAttribute('transform','translate('+p.x.toFixed(1)+' '+p.y.toFixed(1)+') rotate('+p.rot.toFixed(1)+')');
          m.style.opacity=Math.min(1,k/0.3);});
        if(k>=1){c.minis.forEach(m=>m.remove());c.minis=[];c.state='body';c.t=0;c.g.style.opacity=1;}
      } else if(c.state==='body'){
        c.t+=dt;
        place(c,c.body[0]+Math.sin(c.t*1.3+c.ph)*3*w,c.body[1]+Math.cos(c.t*1.1+c.ph)*2*w,Math.sin(c.t+c.ph)*20*w,dt,Math.min(1,0.4+c.t/0.3*0.6));
      }
    }
    ui();
    requestAnimationFrame(tick);
  }



  /* ---------- condução automática ----------
     Quem manda é a prova, na página de fora: ela pede uma parada e as
     hemácias andam sozinhas até lá. Ao chegar, o quadro avisa de volta e
     elas ficam esperando a próxima resposta do aluno. */
  const PARADAS=[0.15, 1.5, 2.75, 3.5, 4.5, 5.5, 6.5, 7.8, 8.5, 9.0];
  let alvo=null, ultimoEmpurrao=0;

  function avisar(tipo,parada){
    try{ parent.postMessage({de:"circulacao",tipo,parada},"*"); }catch(e){}
  }
  function conduzir(now){
    if(alvo===null) return;
    const meta=PARADAS[alvo];
    const p=cells.reduce((a,c)=>a+progress(c),0)/cells.length;
    if(p>=meta-0.02){
      cells.forEach(c=>{c.v=0;});
      const chegou=alvo; alvo=null;
      avisar("parou",chegou);
      return;
    }
    // trechos que só se deixa com um batimento (pulmão, ventrículo, corpo)
    if(cells.some(c=>NEXT[c.state]) && now-ultimoEmpurrao>420){
      ultimoEmpurrao=now; press(); setTimeout(release,200);
    }
    // velocidade de cruzeiro: cada trecho é atravessado em alguns segundos
    cells.forEach(c=>{
      const R=ROUTE[c.state]&&c[ROUTE[c.state]];
      const comprimento = c.state==="path" ? L : (R ? R.L : 0);
      if(comprimento) c.v=comprimento/2;
    });
  }
  addEventListener("message",e=>{
    const d=e.data;
    if(!d||d.para!=="circulacao") return;
    if(d.tipo==="ir") alvo=d.parada;
    else if(d.tipo==="pular"){ teleport(d.parada); alvo=null; }
    else if(d.tipo==="reiniciar"){ reset(); alvo=null; }
  });

  reset();
  requestAnimationFrame(tick);
  avisar("pronto",0);
})();
</script>
</body>
